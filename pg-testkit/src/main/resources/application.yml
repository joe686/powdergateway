server:
  port: 8081

spring:
  application:
    name: pg-testkit
  main:
    banner-mode: off

# PG-TestKit 自身配置
pg-testkit:
  # Mock 服务器端口（模拟上下游 B 系统，PG 端口分发转发到此）
  mock:
    port: 9999
  # PG 后端连接信息
  pg-backend:
    base-url: http://localhost:8080
    username: admin
    password: Admin@123
  # 数据库直连（用于数据校验）
  db:
    config-url: jdbc:mysql://localhost:3306/powergateway_config?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    audit-url: jdbc:mysql://localhost:3306/powergateway_audit?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: qwe12345
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 样例业务库（DemoDb）—— 供 /testkit/demo-db/init 建 10 张 demo_* 表用
    demo-url: jdbc:mysql://localhost:3306/pg_demo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    demo-user: root
    demo-password: qwe12345

# v0.3.0 SOCK-4 · TCP Socket Mock 服务(默认关闭 · 需时手动 enabled=true)
# 仅支持 XML_BOUNDARY 分帧 + UTF-8 编码 · length_prefix + GBK 留 v0.3.7
socket-mock:
  enabled: false
  port: 6500
  rules:
    - function-id: "181345"
      response-file: "mocks/181345-response.xml"

# ─── v0.3.11 CHG-054 · pg-testkit Eureka 多应用自注册 ───
# 默认关闭 · 需外部 Eureka Server(如 http://127.0.0.1:8761/eureka)才有效
# enabled=true 时 · @PostConstruct 批量 POST /apps/{APP} 注册配置的假应用
# 关闭时 @PreDestroy 全量 DELETE deregister
# 手工控制:
#   GET  /test/eureka/list             -- 查已注册列表 + 配置概览
#   POST /test/eureka/register-all     -- 手工触发全量注册
#   POST /test/eureka/register/{name}  -- 单个注册
#   DELETE /test/eureka/deregister-all -- 全量注销
pg-testkit.eureka:
  # v0.3.11 默认关闭 · 用户联调 backend Eureka discover 时开启 + 起 Eureka Server
  # 联机测试手册见 docs/04-测试/pg-testkit-Eureka联机测试手册.md(lcpt-register 8091 已验证)
  enabled: false
  server-url: http://127.0.0.1:8091/eureka
  applications:
    - name: pg-internal
      ip: 127.0.0.1
      port: 8080
      scheme: http
    - name: bank-svc
      ip: 127.0.0.1
      port: 9999
      scheme: http
    - name: host-svc
      ip: 127.0.0.1
      port: 9998
      scheme: http

logging:
  level:
    com.powergateway.testkit: INFO
    org.springframework.web: WARN
