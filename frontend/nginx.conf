# PowerGateway Frontend · v0.3.9 · nginx server 配置(CHG-050)
# 单站点:静态 SPA + /api /swagger-ui /v3/api-docs /webjars 代理到 backend:8080
# 与 vite.config.js dev proxy 一一对应 · 生产 nginx 承担同样职责

server {
    listen       80;
    server_name  _;
    server_tokens off;
    charset utf-8;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA history 模式:所有前端路由(如 /interface/wizard) 回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源长缓存(vite 加了 hash 版本号 · 内容变化必换名)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── /api 代理到 backend 容器(compose 内网服务名 backend:8080) ───
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 大文件上传/下载超时保护
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        client_max_body_size  50m;
    }

    # ─── Swagger UI 与 API 文档(FB-050 · 与 vite dev proxy 对齐) ───
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://backend:8080/webjars/;
        proxy_set_header Host $host;
    }

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 简单错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
